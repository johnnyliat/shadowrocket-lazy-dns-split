name: Sync lazy.conf + DNS patch

# 每天 UTC 01:07（北京时间 09:07）自动同步；也可在 Actions 页面手动触发
# 一次运行同时生成两个成品：纯净版 lazy-dns.conf 与去广告版 lazy-dns-ad.conf
on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lazy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download upstream files
        run: |
          curl -fsSL --retry 3 -o upstream-lazy.conf "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf"
          curl -fsSL --retry 3 -o upstream-sr_ad_only.conf "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_ad_only.conf"
          mkdir -p qx
          for n in Apple China Global WeChat; do
            curl -fsSL --retry 3 -o "qx/$n.list" "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/$n/$n.list"
          done

      - name: Build self-hosted rule-set mirrors (append no-resolve to IP rules)
        run: python3 patch_lists.py qx rules

      - name: Apply DNS split patch (pure version)
        run: python3 patch.py upstream-lazy.conf lazy-dns.conf

      - name: Build ad version (DNS patch + embed ad rules)
        run: python3 patch_ad.py upstream-lazy.conf upstream-sr_ad_only.conf lazy-dns-ad.conf

      - name: Verify no-resolve coverage of all rules (leak guard)
        run: python3 check_no_resolve.py lazy-dns.conf lazy-dns-ad.conf

      - name: Commit if changed
        run: |
          rm -rf upstream-lazy.conf upstream-sr_ad_only.conf qx
          git add lazy-dns.conf lazy-dns-ad.conf rules
          if git diff --cached --quiet; then
            echo "No changes from upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: upstream lazy.conf (+ sr_ad_only) + DNS split patch"
          git push

      - name: Purge jsDelivr cache (best effort; hard consistency check lives in weekly health)
        if: always()
        run: |
          REPO="johnnyliat/shadowrocket-lazy-dns-split@main"
          FILES="lazy-dns.conf lazy-dns-ad.conf rules/Apple.list rules/China.list rules/Global.list rules/WeChat.list"
          for f in $FILES; do curl -fsSL "https://purge.jsdelivr.net/gh/$REPO/$f" > /dev/null || true; done
          # jsDelivr 的分支内容同步是最终一致的，全球节点收敛耗时不可控（实测可达十几分钟），
          # 把它当作构建的及格线只会产生假失败、让真实失败被狼来了淹没。因此这里：
          # 耐心等待约 3 分钟并如实记录结果，未收敛只警告、不判失败；
          # 内容一致性的硬校验移到每周健康检查（health.yml），在收敛窗口之后执行，不一致才真报警。
          ok=0
          for attempt in 1 2 3 4 5 6; do
            sleep 30
            ok=1
            for f in $FILES; do
              want=$(sha256sum "$f" | cut -d' ' -f1)
              got=$(curl -fsSL "https://cdn.jsdelivr.net/gh/$REPO/$f" | sha256sum | cut -d' ' -f1)
              if [ "$want" != "$got" ]; then ok=0; fi
            done
            [ "$ok" = "1" ] && break
            for f in $FILES; do curl -fsSL "https://purge.jsdelivr.net/gh/$REPO/$f" > /dev/null || true; done
          done
          if [ "$ok" = "1" ]; then
            echo "jsDelivr cache in sync with repo."
          else
            echo "::warning::jsDelivr propagation still pending after retries; repo content is correct and Raw serves it now. Weekly health check will hard-fail if this persists."
          fi
