name: Sync lazy.conf + DNS patch

# 每天 UTC 01:07（北京时间 09:07）自动同步；也可在 Actions 页面手动触发
# 一次运行同时生成两个成品：纯净版 lazy-dns.conf 与去广告版 lazy-dns-ad.conf
on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lazy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 推送前可能需要 rebase 到最新远程，需要完整历史
          fetch-depth: 0

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Download upstream files
        run: |
          curl -fsSL --retry 3 -o upstream-lazy.conf "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf"
          curl -fsSL --retry 3 -o upstream-sr_ad_only.conf "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_ad_only.conf"

      - name: Build self-hosted rule-set mirrors (all lists in mirrors.txt)
        run: python3 patch_lists.py

      - name: Compile direct-rule supplement (v2fly + ACL4SSR, two-sided check)
        run: |
          for i in 1 2 3; do
            rm -rf v2fly-data
            if git clone -q --depth 1 https://github.com/v2fly/domain-list-community.git v2fly-data; then
              break
            fi
            echo "clone attempt $i failed, retrying..."
            sleep 10
          done
          [ -d v2fly-data ] || { echo "::error::v2fly data clone failed after 3 attempts"; exit 1; }
          python3 compile_supplement.py --v2fly-dir v2fly-data/data --lazy upstream-lazy.conf --ad upstream-sr_ad_only.conf
          rm -rf v2fly-data

      - name: Apply DNS split patch (pure version)
        run: python3 patch.py upstream-lazy.conf lazy-dns.conf --dns-mode=new

      - name: Build ad version (DNS patch + embed ad rules)
        run: python3 patch_ad.py upstream-lazy.conf upstream-sr_ad_only.conf lazy-dns-ad.conf --dns-mode=new

      - name: Verify no-resolve coverage of all rules (leak guard)
        run: python3 check_no_resolve.py lazy-dns.conf lazy-dns-ad.conf

      - name: Verify routing semantics independently
        run: python3 verify_routing.py lazy-dns.conf lazy-dns-ad.conf

      - name: Write build manifest
        run: python3 build_manifest.py upstream-lazy.conf upstream-sr_ad_only.conf

      - name: Commit if changed
        run: |
          rm -rf upstream-lazy.conf upstream-sr_ad_only.conf
          git add lazy-dns.conf lazy-dns-ad.conf rules manifest.json
          if git diff --cached --quiet; then
            echo "No changes from upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: upstream lazy.conf (+ sr_ad_only) + DNS split patch + supplement"
          # 推送时远程 main 可能已有新提交（网页编辑等），直接 push 会被拒：
          # 先 fetch + rebase 到最新远程再推，最多 3 次；冲突则中止并失败，不覆盖他人提交。
          for i in 1 2 3; do
            git fetch origin main || { echo "fetch failed, retrying..."; sleep 10; continue; }
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::rebase conflict, aborted; next run will retry"
              exit 1
            fi
            if git push; then
              echo "Pushed."
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep 10
          done
          echo "::error::push failed after 3 attempts"
          exit 1
