name: Weekly rule-set health check

# 每周一 UTC 03:17（北京时间 11:17）探活：上游文件、上游配置引用的全部规则集、自家两份成品与其引用的全部镜像；也可手动触发
# 名单不写死：每次运行时从最新 lazy.conf 现场提取 RULE-SET 链接，上游增删自动跟随
# 自家文件走 GitHub Raw 直接读仓库、没有缓存层，能打开就是当前内容，不需要再做缓存一致性比对
# 本工作流不检出代码、不写仓库，纯网络探活，所以不需要任何第三方 Action
# 2026-11-23 教训：GitHub Raw 会对共享 runner 出口 IP 批量返回 429（本次 38 张上游表 36 张 429、两份成品也 429），
# 单次 curl 重试吸不掉分钟级的限流窗口；所以探活分三轮：首轮快检，失败的等 120 秒再检两轮，仍失败才算真故障。
# 请求之间 sleep 1，避免 80 多个请求两分钟内打完、自己撞上限流。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check upstream files and rule-sets
        run: |
          set -u
          RETRY="--retry 2 --retry-delay 2 --retry-max-time 60"
          FAIL_OUT=/tmp/fails.txt
          check() {
            url="$1"
            mode="${2:-}"
            code=$(curl -sSL -o /tmp/body -w "%{http_code}" --max-time 30 $RETRY "$url") || code="000"
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            if [ "$code" != "200" ] || [ "$size" -lt 10 ]; then
              echo "FAIL [$code, ${size}B] $url"
              printf '%s\t%s\n' "$url" "$mode" >> "$FAIL_OUT"
            elif [ "$mode" = "ruleset" ] && ! grep -qE '^(DOMAIN|HOST|IP-|USER-AGENT|URL-REGEX|GEOIP|AND,|OR,|NOT,)' /tmp/body; then
              echo "FAIL [200, ${size}B, no rule lines] $url"
              printf '%s\t%s\n' "$url" "$mode" >> "$FAIL_OUT"
            else
              echo "OK   [$code, ${size}B] $url"
            fi
          }
          run_pass() {
            in_list="$1"
            out_list="$2"
            FAIL_OUT="$out_list"
            : > "$out_list"
            while IFS=$'\t' read -r u m; do
              [ -z "$u" ] && continue
              check "$u" "$m"
              sleep 1
            done < "$in_list"
            [ ! -s "$out_list" ]
          }
          dl_retry() {
            url="$1"
            out="$2"
            label="$3"
            i=1
            while [ "$i" -le 4 ]; do
              if curl -fsSL --retry 3 --retry-delay 5 --retry-max-time 120 -o "$out" "$url"; then
                return 0
              fi
              echo "WARN [$label] 下载第 $i 次失败，60 秒后重试"
              [ "$i" -lt 4 ] && sleep 60
              i=$((i+1))
            done
            return 1
          }
          dl_retry "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf" /tmp/lazy.conf "上游 lazy.conf" || { echo "::error::上游 lazy.conf 下载失败，无法提取规则集清单"; exit 1; }
          grep -oE "RULE-SET,https://[^,]+" /tmp/lazy.conf | sed 's/^RULE-SET,//' | sort -u > /tmp/urls.txt
          [ -s /tmp/urls.txt ] || { echo "::error::未从上游 lazy.conf 提取到规则集清单"; exit 1; }
          echo "Rule-sets found: $(wc -l < /tmp/urls.txt)"
          dl_retry "https://raw.githubusercontent.com/johnnyliat/shadowrocket-lazy-dns-split/main/lazy-dns.conf" /tmp/lazy-dns.conf "自家成品" || { echo "::error::自家成品下载失败，无法提取镜像清单"; exit 1; }
          grep -oE "RULE-SET,https://[^,]+" /tmp/lazy-dns.conf | sed 's/^RULE-SET,//' | sort -u > /tmp/selfurls.txt
          [ -s /tmp/selfurls.txt ] || { echo "::error::未从自家成品提取到镜像链接"; exit 1; }
          echo "Self-hosted rule-sets found: $(wc -l < /tmp/selfurls.txt)"
          : > /tmp/pass1.txt
          printf '%s\t%s\n' "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf" "" >> /tmp/pass1.txt
          printf '%s\t%s\n' "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_ad_only.conf" "" >> /tmp/pass1.txt
          while IFS= read -r u; do printf '%s\t%s\n' "$u" "" >> /tmp/pass1.txt; done < /tmp/urls.txt
          printf '%s\t%s\n' "https://raw.githubusercontent.com/johnnyliat/shadowrocket-lazy-dns-split/main/lazy-dns.conf" "" >> /tmp/pass1.txt
          printf '%s\t%s\n' "https://raw.githubusercontent.com/johnnyliat/shadowrocket-lazy-dns-split/main/lazy-dns-ad.conf" "" >> /tmp/pass1.txt
          while IFS= read -r u; do printf '%s\t%s\n' "$u" "ruleset" >> /tmp/pass1.txt; done < /tmp/selfurls.txt
          echo "Pass 1: $(wc -l < /tmp/pass1.txt) URLs"
          if run_pass /tmp/pass1.txt /tmp/fail1.txt; then
            echo "All URLs healthy."
          else
            echo "Pass 1 failed: $(wc -l < /tmp/fail1.txt) URLs, waiting 120s for rate-limit window to clear"
            sleep 120
            echo "Pass 2: $(wc -l < /tmp/fail1.txt) URLs"
            if run_pass /tmp/fail1.txt /tmp/fail2.txt; then
              echo "All URLs healthy after retry."
            else
              echo "Pass 2 failed: $(wc -l < /tmp/fail2.txt) URLs, waiting 120s"
              sleep 120
              echo "Pass 3: $(wc -l < /tmp/fail2.txt) URLs"
              if run_pass /tmp/fail2.txt /tmp/fail3.txt; then
                echo "All URLs healthy after retry."
              else
                echo "FAIL lines (after 3 passes):"
                cut -f1 /tmp/fail3.txt
                echo "::error::Some upstream/rule-set URLs are unavailable (see FAIL lines above)."
                exit 1
              fi
            fi
          fi

      - name: Verify published content matches manifest
        run: |
          set -u
          command -v jq >/dev/null || { echo "::error::jq 不可用"; exit 1; }
          dl_retry() {
            url="$1"
            out="$2"
            label="$3"
            i=1
            while [ "$i" -le 4 ]; do
              if curl -fsSL --retry 3 --retry-delay 5 --retry-max-time 120 -o "$out" "$url"; then
                return 0
              fi
              echo "WARN [$label] 下载第 $i 次失败，60 秒后重试"
              [ "$i" -lt 4 ] && sleep 60
              i=$((i+1))
            done
            return 1
          }
          dl_retry "https://raw.githubusercontent.com/johnnyliat/shadowrocket-lazy-dns-split/main/manifest.json" /tmp/manifest.json "manifest.json" || { echo "::error::manifest.json 下载失败"; exit 1; }
          jq -e . /tmp/manifest.json >/dev/null || { echo "::error::manifest.json 不是合法 JSON"; exit 1; }
          for f in lazy-dns.conf lazy-dns-ad.conf; do
            dl_retry "https://raw.githubusercontent.com/johnnyliat/shadowrocket-lazy-dns-split/main/$f" "/tmp/$f" "$f" || { echo "::error::$f 下载失败"; exit 1; }
            want=$(jq -r --arg f "$f" '.products[$f].sha256' /tmp/manifest.json)
            got=$(sha256sum "/tmp/$f" | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then echo "::error::$f 的 SHA256 与 manifest 不一致（manifest=$want 实际=$got）"; exit 1; fi
            echo "OK $f sha256 与 manifest 一致"
          done
          mirror_count=$(jq -r '.rules | length' /tmp/manifest.json)
          [ "$mirror_count" -gt 0 ] || { echo "::error::manifest.json 里没有规则镜像记录"; exit 1; }
          jq -r '.rules | keys[]' /tmp/manifest.json > /tmp/rule-names.txt
          : > /tmp/rule-fails.txt
          while IFS= read -r name; do
            if curl -fsSL --retry 2 --retry-delay 2 --retry-max-time 60 -o /tmp/rule.tmp "https://raw.githubusercontent.com/johnnyliat/shadowrocket-lazy-dns-split/main/rules/$name"; then
              want=$(jq -r --arg n "$name" '.rules[$n].sha256' /tmp/manifest.json)
              got=$(sha256sum /tmp/rule.tmp | cut -d' ' -f1)
              if [ "$want" != "$got" ]; then echo "FAIL 规则镜像 $name 的 SHA256 与 manifest 不一致（manifest=$want 实际=$got）"; echo "$name" >> /tmp/rule-fails.txt; fi
            else
              echo "FAIL 规则镜像 $name 下载失败"
              echo "$name" >> /tmp/rule-fails.txt
            fi
            sleep 1
          done < /tmp/rule-names.txt
          if [ -s /tmp/rule-fails.txt ]; then
            echo "规则镜像失败 $(wc -l < /tmp/rule-fails.txt) 张，等待 120 秒后只重验失败的"
            sleep 120
            : > /tmp/rule-fails2.txt
            while IFS= read -r name; do
              if curl -fsSL --retry 2 --retry-delay 2 --retry-max-time 60 -o /tmp/rule.tmp "https://raw.githubusercontent.com/johnnyliat/shadowrocket-lazy-dns-split/main/rules/$name"; then
                want=$(jq -r --arg n "$name" '.rules[$n].sha256' /tmp/manifest.json)
                got=$(sha256sum /tmp/rule.tmp | cut -d' ' -f1)
                if [ "$want" != "$got" ]; then echo "::error::规则镜像 $name 的 SHA256 与 manifest 不一致（manifest=$want 实际=$got）"; echo "$name" >> /tmp/rule-fails2.txt; fi
              else
                echo "::error::规则镜像 $name 下载失败"
                echo "$name" >> /tmp/rule-fails2.txt
              fi
              sleep 1
            done < /tmp/rule-fails.txt
            [ -s /tmp/rule-fails2.txt ] && exit 1
          fi
          echo "OK 全部 $mirror_count 张规则镜像 sha256 与 manifest 一致"
          grep -q "dns-server = https://cloudflare-dns.com/dns-query#proxy" /tmp/lazy-dns.conf || { echo "::error::基础版缺少 #proxy 预解析 DNS 行"; exit 1; }
          grep -q "dns-server = https://cloudflare-dns.com/dns-query#proxy" /tmp/lazy-dns-ad.conf || { echo "::error::去广告版缺少 #proxy 预解析 DNS 行"; exit 1; }
          grep -q "FINAL,PROXY,force-remote-dns" /tmp/lazy-dns.conf || { echo "::error::基础版缺少 FINAL 远端解析行"; exit 1; }
          grep -q "FINAL,PROXY,force-remote-dns" /tmp/lazy-dns-ad.conf || { echo "::error::去广告版缺少 FINAL 远端解析行"; exit 1; }
          echo "Content integrity OK."
