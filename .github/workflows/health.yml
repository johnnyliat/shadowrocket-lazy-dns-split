name: Weekly rule-set health check

# 每周一 UTC 03:17（北京时间 11:17）检查上游、全部远程规则集与自家 CDN 分发面是否可用，
# 并硬校验 jsDelivr 上的六个文件与仓库内容逐字节一致；也可手动触发
# 名单不写死：每次运行时从最新 lazy.conf 现场提取 RULE-SET 链接，上游增删自动跟随
# CDN 一致性放在这里做硬校验，是因为 jsDelivr 同步收敛可达十几分钟，只有拉开时间窗口判失败才不会误报
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check upstream files and rule-sets
        run: |
          set -u
          fail=0
          check() {
            url="$1"
            code=$(curl -sSL -o /tmp/body -w "%{http_code}" --max-time 30 --retry 2 "$url") || code="000"
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            if [ "$code" != "200" ] || [ "$size" -lt 10 ]; then
              echo "FAIL [$code, ${size}B] $url"
              fail=1
            else
              echo "OK   [$code, ${size}B] $url"
            fi
          }
          check "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf"
          check "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_ad_only.conf"
          curl -fsSL --retry 3 -o /tmp/lazy.conf "https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy.conf"
          grep -oE "RULE-SET,https://[^,]+" /tmp/lazy.conf | sed 's/^RULE-SET,//' | sort -u > /tmp/urls.txt
          echo "Rule-sets found: $(wc -l < /tmp/urls.txt)"
          while IFS= read -r u; do check "$u"; done < /tmp/urls.txt
          echo "First-party CDN surfaces:"
          check "https://cdn.jsdelivr.net/gh/johnnyliat/shadowrocket-lazy-dns-split@main/lazy-dns.conf"
          check "https://cdn.jsdelivr.net/gh/johnnyliat/shadowrocket-lazy-dns-split@main/lazy-dns-ad.conf"
          for n in Apple China Global WeChat; do
            check "https://cdn.jsdelivr.net/gh/johnnyliat/shadowrocket-lazy-dns-split@main/rules/$n.list"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Some upstream/rule-set URLs are unavailable (see FAIL lines above)."
            exit 1
          fi
          echo "All URLs healthy."

      - name: Verify jsDelivr content matches repo (hard check)
        run: |
          REPO="johnnyliat/shadowrocket-lazy-dns-split@main"
          FILES="lazy-dns.conf lazy-dns-ad.conf rules/Apple.list rules/China.list rules/Global.list rules/WeChat.list"
          fail=0
          for f in $FILES; do
            want=$(sha256sum "$f" | cut -d' ' -f1)
            got=$(curl -fsSL "https://cdn.jsdelivr.net/gh/$REPO/$f" | sha256sum | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then
              echo "MISMATCH: $f"
              fail=1
            else
              echo "OK: $f matches repo"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::jsDelivr content does not match repo in weekly hard check."
            exit 1
          fi
          echo "jsDelivr content matches repo on all 6 files."
